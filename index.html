        }

        .panel {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 16px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(10px);
        }

        .header-panel {
            border-top: 4px solid #16a34a;
        }

        .stat-tile {
            min-height: 58px;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff, #f7faf7);

        .race-values {
            grid-template-columns: repeat(2, minmax(0, 1fr));

        .race-columns { display: grid; grid-template-columns: minmax(0, 1fr) 84px 84px; gap: 6px; align-items: center; }
        .race-list-header { color: #647168; font-size: 11px; padding-bottom: 6px; }
        .race-summary { display: block; width: 100%; padding: 10px 0; border-top: 1px solid #dce5df; text-align: left; background: transparent; }
        .race-summary:hover { background: #f4f8f5; }
        .race-summary:focus-visible { outline: 2px solid #15803d; outline-offset: 2px; }
        .race-summary-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 700; }
        .race-summary-money { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .race-summary-meta { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, 84px); gap: 6px; margin-top: 4px; font-size: 11px; line-height: 18px; color: #647168; }

        .race-dialog { width: calc(100% - 24px); max-width: 480px; max-height: calc(100dvh - 24px); margin: auto; padding: 16px; border: 1px solid #cdd8d0; border-radius: 8px; overflow-y: auto; }

        .race-dialog .race-record { border: 0; padding: 12px 0; }
        .race-dialog .race-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .race-dialog .race-meta label:first-child { grid-column: 1 / -1; }
        .editor-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; }
        .editor-actions button { min-height: 44px; padding: 8px 16px; border: 1px solid #cdd8d0; border-radius: 4px; }

            display: block;
            min-width: 0;
            color: #4b5563;
            font-size: 12px;

        .race-record input, .race-record select {
            display: block;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            min-height: 44px;
            margin-top: 4px;
            padding: 6px 4px;
            border: 1px solid #cdd8d0;
            border-radius: 4px;
            background: #fff;
            color: #18251d;
            font-size: 16px;
            line-height: 24px;
        }

        .race-record input[inputmode="numeric"] {
            text-align: right;
            font-variant-numeric: tabular-nums;

            outline: 2px solid #15803d;

            .stat-tile { overflow-wrap: anywhere; }
            .settlement-card .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 8px; }

    </style>
</head>

        const roundDownToHundred = (value) => Math.floor(value / 100) * 100;

        const formatShortDate = (date) => date.replace(/^\d{4}\//, '');
        // JRAの2026年公式日程に合わせ、旧初期データだけを補正する。

          const surplus = [];

            { date: '2026/8/23', race: 'キーンランドC(札幌)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/8/30', race: '新潟2歳S(新潟)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/9/6', race: '小倉2歳S(小倉)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/9/13', race: 'セントライト(中山)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/9/20', race: '神戸新聞杯(阪神)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/9/27', race: 'オールカマー(中山)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/10/4', race: 'スプリンターズS(中山)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/10/11', race: '毎日王冠(東京)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/10/18', race: '秋華賞(京都)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/10/25', race: '菊花賞(京都)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/11/1', race: '天皇賞秋(東京)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/11/8', race: 'アルゼンチン共和国杯(東京)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/11/15', race: 'エリザベス女王杯(京都)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/11/22', race: 'マイルCS(京都)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/11/29', race: 'ジャパンC(東京)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/12/6', race: 'チャンピオンズC(中京)', commander: '中山', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/12/13', race: '阪神JF(阪神)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/12/20', race: '朝日杯FS(阪神)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: false },
            { date: '2026/12/27', race: '有馬記念(中山)', commander: '中山', buyer: '中山', investment: 0, payout: 0, isSpecial: true },
            { date: '2026/12/27', race: '有馬記念(越野)', commander: '越野', buyer: '越野', investment: 0, payout: 0, isSpecial: true },
            { date: '2026/12/27', race: '有馬記念(鈴木)', commander: '鈴木', buyer: '鈴木', investment: 0, payout: 0, isSpecial: true },
          ];

          const loadSavedData = () => {
            try {
              const saved = localStorage.getItem('keiba_races_2026');
              if (saved) {
                let loaded = JSON.parse(saved);
                if (!localStorage.getItem('keiba_schedule_2026_v2')) {
                  localStorage.setItem('keiba_races_2026_before_schedule_v2', saved);
                  loaded = correctSchedule(loaded);
                }
                if (!localStorage.getItem('keiba_sunday_races_2026_v4')) {
                  localStorage.setItem('keiba_races_2026_before_sunday_v4', saved);
                  loaded = preferSundayRaces(loaded);
                }
                if (!localStorage.getItem('keiba_weekly_schedule_2026_v5')) {
                  localStorage.setItem('keiba_races_2026_before_weekly_v5', saved);
                  loaded = repairWeeklySchedule(loaded);
                }
                return loaded;
              }
            } catch (e) {
              console.error('データ読み込みエラー:', e);
            }
            return initialRaces.map(race => ({ ...race, race: weeklySchedule[race.date] }));
          };

          const [races, setRaces] = useState(loadSavedData);

          useEffect(() => {
            try {
              localStorage.setItem('keiba_races_2026', JSON.stringify(races));
              localStorage.setItem('keiba_schedule_2026_v2', '1');
              localStorage.setItem('keiba_sunday_races_2026_v4', '1');
              localStorage.setItem('keiba_weekly_schedule_2026_v5', '1');
              setLastSaved(new Date());
            } catch (e) {
              console.error('データ保存エラー:', e);
            }
          }, [races]);

          const stats = useMemo(() => {
            const result = {
              '中山': { normalPurchases: 0, specialPurchases: 0, contribution: 0, received: 0, advancedPayment: 0, holdingPayout: 0, settlement: 0 },
              '越野': { normalPurchases: 0, specialPurchases: 0, contribution: 0, received: 0, advancedPayment: 0, holdingPayout: 0, settlement: 0 },
              '鈴木': { normalPurchases: 0, specialPurchases: 0, contribution: 0, received: 0, advancedPayment: 0, holdingPayout: 0, settlement: 0 }
            };

            races.forEach(race => {
              const isPurchased = race.investment > 0;
              if (isPurchased) {
                if (race.isSpecial) {
                  result[race.buyer].specialPurchases++;
                } else {
                  result[race.buyer].normalPurchases++;
                }
              }
              result[race.buyer].advancedPayment += race.investment;
              if (race.payout > 0) {
                result[race.buyer].holdingPayout += race.payout;
              }
            });

            const totalInvestment = races.reduce((sum, r) => sum + r.investment, 0);
            const totalAllPayout = races.reduce((sum, r) => sum + r.payout, 0);

            ['中山', '越野', '鈴木'].forEach(person => {
              result[person].contribution = splitByThree(totalInvestment);
              result[person].received = splitByThree(totalAllPayout);
              result[person].settlement = roundSettlementToHundred(result[person].received - result[person].contribution - result[person].holdingPayout + result[person].advancedPayment);
            });

            return result;
          }, [races]);

          const updateDraft = (field, value) => setEditing(current => ({ ...current, draft: { ...current.draft, [field]: value } }));
          const saveEditedRace = (event) => {
            event.preventDefault();
            const investment = Number(editing.draft.investment);
            const payout = Number(editing.draft.payout);
            if (![investment, payout].every(value => Number.isSafeInteger(value) && value >= 0)) return;
            const index = editing.index;
            const updated = { ...editing.draft, investment, payout, race: editing.draft.race.trim() };
            setRaces(current => current.map((race, raceIndex) => raceIndex === index ? updated : race));
            setEditing(null);
          };

          const exportToCSV = () => {
            let csv = '日付,レース名,指揮者,購入者,投資金額,的中金額\n';
            races.forEach(race => {
              csv += `${race.date},${race.race},${race.commander},${race.buyer},${race.investment},${race.payout}\n`;
            });

            csv += '\n年末清算\n';
            csv += '氏名,購入金額,預当額,負担金,配当受取,清算額\n';
            ['中山', '越野', '鈴木'].forEach(person => {
              const s = stats[person];
              csv += `${person},${s.advancedPayment},${s.holdingPayout},-${s.contribution},${s.received},${s.settlement >= 0 ? '受取' : '支払'}${Math.abs(s.settlement)}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '2026年競馬共同購入記録.csv';
            link.click();
          };

          const totalPayout = races.reduce((sum, r) => sum + r.payout, 0);
          const totalInvestment = races.reduce((sum, r) => sum + r.investment, 0);
          const netProfit = totalPayout - totalInvestment;
          const visibleRaces = races.map((race, index) => ({ race, index })).filter(({ race }) => selectedMonth === 'all' || String(Number(race.date.split('/')[1])) === selectedMonth);

          return (
            <div className="min-h-screen horse-page p-3 sm:p-4">
              <div className="tracker-shell mx-auto">
                <div className="panel header-panel p-4 mb-3">
                  <div className="flex justify-between items-center mb-3 gap-3">
                    <h1 className="text-lg font-black text-slate-800 leading-tight">2026年 競馬共同購入</h1>
                    {lastSaved && (
                      <div className="flex items-center gap-1 text-xs text-emerald-700 bg-emerald-50 px-2 py-1 rounded-full shrink-0">
                        <Save />
                        <span>保存済</span>
                      </div>
                    )}
                  </div>

                  <div className="grid grid-cols-4 gap-2 text-xs">
                    <div className="stat-tile text-center">
                      <div className="text-gray-600 text-xs">投資</div>
                      <div className="font-bold text-blue-600">{formatYen(totalInvestment)}</div>
                    </div>
                    <div className="stat-tile text-center">
                      <div className="text-gray-600 text-xs">的中</div>
                      <div className="font-bold text-green-600">{formatYen(totalPayout)}</div>
                    </div>
                    <div className="stat-tile text-center">
                      <div className="text-gray-600 text-xs">損益</div>
                      <div className={`font-bold ${netProfit >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                        {netProfit >= 0 ? '+' : '-'}{formatYen(netProfit)}
                      </div>
                    </div>
                    <div className="stat-tile text-center">
                      <div className="text-gray-600 text-xs">回収率</div>
                      <div className="font-bold text-purple-600">
                        {totalInvestment > 0 ? ((totalPayout / totalInvestment) * 100).toFixed(0) : 0}%
                      </div>
                    </div>
                  </div>
                </div>

                <div className="panel p-3 mb-3">
                  <h2 className="text-sm font-bold mb-2 text-slate-800">個人成績</h2>
                  <div className="person-grid px-2 pb-1 text-[11px] font-bold text-slate-500">
                    <span></span>
                    <span className="text-center">指揮</span>
                    <span className="text-center">購入</span>
                    <span className="text-right">投資</span>
                    <span className="text-right">的中</span>
                  </div>
                  <div className="space-y-2">
                    {['中山', '越野', '鈴木'].map(person => {
                      const s = stats[person];
                      const commandCount = races.filter(r => r.commander === person && r.investment > 0).length;
                      const buyCount = s.normalPurchases + s.specialPurchases;
                      const commandPayout = races.filter(r => r.commander === person && r.investment > 0).reduce((sum, r) => sum + r.payout, 0);

                      return (
                        <div key={person} className="person-grid person-row text-xs rounded-xl px-2 py-2">
                          <span className="font-bold">{person}</span>
                          <span className="text-center text-gray-600">{commandCount}</span>
                          <span className="text-center text-gray-600">{buyCount}</span>
                          <span className="text-right text-orange-600">{formatYen(s.advancedPayment)}</span>
                          <span className="text-right text-blue-600">{formatYen(commandPayout)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="panel settlement-card p-3 mb-3 border">
                  <h2 className="text-sm font-bold text-emerald-900 mb-2">年末清算</h2>
                  {['中山', '越野', '鈴木'].map(person => {
                    const s = stats[person];
                    return (
                      <div key={person} className="bg-white/90 rounded-xl p-3 mb-2 last:mb-0 border border-white">
                        <div className="flex justify-between items-center mb-1">
                          <span className="text-sm font-bold">{person}</span>
                          <span className={`text-base font-bold ${s.settlement >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                            {s.settlement >= 0 ? '受取 ' : '支払 '}{formatYen(s.settlement)}
                          </span>
                        </div>
                        <div className="grid grid-cols-4 gap-1 text-xs text-gray-600">
                          <div className="text-center">
                            <div className="text-xs">購入</div>
                            <div className="font-semibold text-orange-600">{formatYen(s.advancedPayment)}</div>
                          </div>
                          <div className="text-center">
                            <div className="text-xs">預り</div>
                            <div className="font-semibold text-blue-600">{formatYen(s.holdingPayout)}</div>
                          </div>
                          <div className="text-center">
                            <div className="text-xs">負担</div>
                            <div className="font-semibold text-red-600">{formatYen(s.contribution)}</div>
                          </div>
                          <div className="text-center">
                            <div className="text-xs">配当</div>
                            <div className="font-semibold text-green-600">{formatYen(s.received)}</div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="panel p-3 mb-3">
                  <button
                    onClick={() => setShowRaces(!showRaces)}
                    className="w-full flex justify-between items-center text-sm font-bold text-slate-800"
                  >
                    <span>レース記録 ({races.length}件)</span>
                    {showRaces ? <ChevronUp /> : <ChevronDown />}
                  </button>
                  {showRaces && (
                    <div className="mt-2">
                      <div className="month-bar">
                        <button type="button" aria-label="前の月" title="前の月" disabled={selectedMonth === 'all' || selectedMonth === '1'} onClick={() => setSelectedMonth(String(Number(selectedMonth) - 1))}><span style={{ transform: 'rotate(-90deg)' }}><ChevronUp /></span></button>
                        <select aria-label="表示月" value={selectedMonth} onChange={event => setSelectedMonth(event.target.value)}>
                          {Array.from({ length: 12 }, (_, index) => <option key={index} value={String(index + 1)}>{index + 1}月</option>)}
                          <option value="all">年間一覧</option>
                        </select>
                        <button type="button" aria-label="次の月" title="次の月" disabled={selectedMonth === 'all' || selectedMonth === '12'} onClick={() => setSelectedMonth(String(Number(selectedMonth) + 1))}><span style={{ transform: 'rotate(90deg)' }}><ChevronUp /></span></button>
                      </div>
                      <div className="race-columns race-list-header"><span>レース</span><span className="text-right">投資（円）</span><span className="text-right">的中（円）</span></div>
                      {visibleRaces.map(({ race, index }) => (
                        <button type="button" key={index} className="race-summary" aria-label={`${formatShortDate(race.date)} ${race.race}を編集`} onClick={() => setEditing({ index, draft: { ...race } })}>
                          <span className="race-columns">
                            <span className="race-summary-name" title={race.race}>{race.race}</span>
                            <span className="race-summary-money text-orange-600">{race.investment.toLocaleString('ja-JP')}</span>
                            <span className="race-summary-money text-blue-600">{race.payout.toLocaleString('ja-JP')}</span>
                          </span>
                          <span className="race-summary-meta"><span>{formatShortDate(race.date)}</span><span>指揮：{race.commander}</span><span>購入：{race.buyer}</span></span>
                        </button>
                      ))}
                      {visibleRaces.length === 0 && <p className="py-4 text-sm text-gray-500">レース記録なし</p>}
                    </div>
                  )}
                </div>

                <dialog ref={dialogRef} className="race-dialog" aria-labelledby="race-editor-title" onCancel={() => setEditing(null)} onClick={event => { if (event.target === event.currentTarget) setEditing(null); }}>
                  {editing && (
                    <form onSubmit={saveEditedRace}>
                      <h2 id="race-editor-title" className="text-base font-bold">レース編集</h2>
                      <div className="race-record">
                        <div className="race-meta">
                          <label>日付<input aria-label="日付" type="date" required value={editing.draft.date.split('/').map((part, index) => index ? part.padStart(2, '0') : part).join('-')} onChange={event => updateDraft('date', event.target.value.split('-').map((part, index) => index ? String(Number(part)) : part).join('/'))} /></label>
                          <label>指揮者<select aria-label="指揮者" value={editing.draft.commander} onChange={event => updateDraft('commander', event.target.value)}>{['中山', '越野', '鈴木'].map(person => <option key={person}>{person}</option>)}</select></label>
                          <label>購入者<select aria-label="購入者" value={editing.draft.buyer} onChange={event => updateDraft('buyer', event.target.value)}>{['中山', '越野', '鈴木'].map(person => <option key={person}>{person}</option>)}</select></label>
                        </div>
                        <div className="race-values">
                          <label className="race-name">レース名<input aria-label="レース名" type="text" required value={editing.draft.race} onChange={event => updateDraft('race', event.target.value)} /></label>
                          <label>投資額（円）<input aria-label="投資額" type="text" inputMode="numeric" pattern="[0-9]+" required value={editing.draft.investment} onChange={event => updateDraft('investment', event.target.value)} /></label>
                          <label>的中額（円）<input aria-label="的中額" type="text" inputMode="numeric" pattern="[0-9]+" required value={editing.draft.payout} onChange={event => updateDraft('payout', event.target.value)} /></label>
                        </div>
                      </div>
                      <div className="editor-actions"><button type="button" onClick={() => setEditing(null)}>キャンセル</button><button type="submit" className="editor-save">保存</button></div>
                    </form>
                  )}
                </dialog>

                <button onClick={exportToCSV} className="csv-button w-full text-white py-3 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2">
                  <Download />
                  CSV出力
                </button>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(HorseBettingTracker));
    </script>
</body>
</html>
